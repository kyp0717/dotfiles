[package]
name = "rust-whisper-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
whisper-rs = "0.13"
hound = "3.5"       # For WAV audio decoding
tempfile = "3.8"

[features]
# cuda: compile whisper.cpp with CUDA offload (NVIDIA machines, e.g. linden's
# GTX 1070). Requires the CUDA toolkit at build time and the NVIDIA driver at
# runtime. Without this feature the server runs CPU-only (woodlawn).
default = []
cuda = ["whisper-rs/cuda"]
